##
## Mixer Devices
##
ctl.AndroidOut {
    type hw
    card 0
}

ctl.AndroidIn {
    type hw
    card 0
}

ctl.AndroidPlayback {
    type hw
    card 0
}

ctl.AndroidRecord {
    type hw
    card 0
}

##
## Playback Devices
##

# Type Plug Definitions
# I match it with a default of ALSA
# (Sampling rate and Channel num)
pcm.PlaybackPortA {
    type plug
    slave {
        pcm {
            type hw
            card 0
            device 0
        }
    }
}

pcm.PlaybackPortA_16000 {
    type plug
    slave {
        pcm {
            type hw
            card 0
            device 0
        }
        rate 16000
        channels 1
    }
}

pcm.PlaybackPortB_BT_16000 {
    type plug
    slave {
        pcm {
            type hw
            card 0
            device 1
        }
        rate 16000
        channels 1
    }
}

pcm.PlaybackPortB_BT_8000 {
    type plug
    slave {
        pcm {
            type hw
            card 0
            device 1
        }
        rate 8000
        channels 1
    }
}

pcm.Playback_FM {
    type plug
    slave {
        pcm {
            type hw
            card 0
            device 0
        }
        format S24_LE
    }
}

pcm.Playback_incomm {
    type plug
    slave {
        pcm {
            type hw
            card 0
            device 0
        }
        channels 1
    }
}

# Default device (same AndroidPlayback_Speaker_normal)
pcm.AndroidPlayback {
    type hooks
    slave.pcm PlaybackPortA
    hooks.0 {
        type ctl_elems
        hook_args [
			{ name 'DAC Voice Cutoff'   value '2.5Hz' }
			{ name 'DAC Voice Mode Switch'   value 'Off' }
			{ name 'DAC HPF Cutoff'   value 'Fs/24000' }
			{ name 'DAC HPF Switch'   value 'Off' }
			{ name 'DAC EQ1 Volume'   value 8 }
			{ name 'DAC EQ2 Volume'   value 8 }
			{ name 'DAC EQ3 Volume'   value 8 }
			{ name 'DAC EQ4 Volume'   value 8 }
			{ name 'DAC EQ5 Volume'   value 8 }
			{ name 'DAC EQ Switch'   value 'Off' }
			{ name 'Limiter Power/THD Attack Rate'   value '30 us/dB' }
			{ name 'Limiter Power/THD Release Rate'   value '20 ms/dB' }
			{ name 'Limiter Power/THD Hold Time'   value '30 us' }
			{ name 'Limiter Power Switch'   value 'Off' }
			{ name 'Limiter THD Switch'   value 'Off' }
			{ name 'Limiter Power Hysteresis Switch'   value 'Off' }
			{ name 'Limiter THD Hysteresis Switch'   value 'Off' }
			{ name 'Limiter Power Limit'   value 0 }
			{ name 'Limiter THD Limit'   value 0 }
			{ name 'Limiter NG Attenuation'   value 0 }
			{ name 'Limiter NG Switch'   value 'Off' }
			{ name 'Limiter NG Attack Rate'   value '30 us/dB' }
			{ name 'Limiter NG Release Rate'   value '20 ms/dB' }
			{ name 'Limiter NG Hold Time'   value '10 ms' }
			{ name 'EP Switch'   value 'Off' }
			{ name 'HP Switch'   value [0 0] }
			{ name 'Out Mixer Earpiece DAC Right Switch'   value 'Off' }
			{ name 'Out Mixer Right DAC Right Switch'   value 'Off' }
			{ name 'Out Mixer Left DAC Left Switch'   value 'Off' }
			{ name 'DAC NG Switch'   value 'Off' }
			{ name 'DAC NG ON Threshold'   value 0 }			
			{ name 'DAC Volume'   value [111 111] }
			{ name 'Playback Speaker Volume'   value 57 }
			{ name 'DAC Right Source MUX'   value 'AIF Input Right' }
			{ name 'DAC Left Source MUX'   value 'AIF Input Left' }
			{ name 'Out Mixer Speaker DAC Right Switch'   value 'On' }
			{ name 'DAC Mono Switch'   value [0 1] }
			{ name 'Path'   value 0x00000020 }
        ]
    }
}

