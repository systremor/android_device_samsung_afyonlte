pcm.CapturePortA {
    type plug
    slave {
        pcm {
            type hw
            card 0
            device 0
        }
        rate 48000
        channels 2
    }
}

pcm.CapturePortA_16000 {
    type plug
    slave {
        pcm {
            type hw
            card 0
            device 0
        }
        rate 16000
        channels 1
    }
}

